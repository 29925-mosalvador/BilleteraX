name: BilleteraX - compilar y probar

on:
  push:
    branches: [main]
    paths: ['backend/**', 'android/**', '.github/workflows/**', '.gitattributes']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'android/**', '.github/workflows/**', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billeterax-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Java 21
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Probar y generar JAR
        run: bash gradlew test bootJar --no-daemon --console=plain
      - name: Guardar JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BilleteraX-backend
          path: backend/build/libs/billeterax.jar
          if-no-files-found: error
          retention-days: 14
      - name: Guardar resultados backend
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BilleteraX-pruebas-backend
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          retention-days: 14

  android:
    name: Android - APK, pruebas unitarias y lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Preparar SDK requerido
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36.1' 'build-tools;35.0.0'
      - name: Compilar APK y pruebas; ejecutar unitarias y lint
        run: bash gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --no-daemon --console=plain
      - name: Guardar APK de CI (firma temporal del runner)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BilleteraX-ci-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Guardar resultados Android
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BilleteraX-pruebas-android
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
          retention-days: 14
